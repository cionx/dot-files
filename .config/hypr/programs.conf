# This file contains standard programs.
# See https://wiki.hypr.land/Configuring/Keywords/

$terminal = kitty
$editor = nvim

# $menu = krunner
$menu = wofi

$fileManager = dolphin
$webBrowser = firefox

$screenShotOptions = --filename "$(date +'screenshot_%Y%m%d_%H%M%S').png" --output-folder ~/screenshots -- optipng
$screenshotWindow  = hyprshot --mode window $screenShotOptions
$screenshotRegion  = hyprshot --mode region $screenShotOptions
$screenshotMonitor = hyprshot --mode output --mode active $screenShotOptions

$overlay = gromit-mpx
